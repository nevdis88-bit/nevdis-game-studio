<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>文案适配检查</title>
<style>
:root{--bg:#f5f5f7;--panel:rgba(255,255,255,.92);--text:#1d1d1f;--muted:#86868b;--line:#dfe3e8;--green:#1f9d68;--greenbg:#edf8f2;--yellow:#a86800;--yellowbg:#fff6df;--red:#d84040;--redbg:#fff0f0;--blue:#0a84ff;--blueSoft:#eaf3ff;--shadow:0 10px 30px rgba(0,0,0,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"TikTok Sense","TikTok Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1200px;margin:auto;padding:36px 30px 44px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:24px}h1{margin:0 0 7px;font-size:30px;line-height:1.2;letter-spacing:-.7px;font-weight:750}.sub{color:var(--muted);font-size:14px;line-height:1.5}.fontstate{background:#fff6df;border:1px solid #f0dfad;border-radius:9px;padding:8px 10px;font-size:11px;white-space:nowrap;color:#7a5b13}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#bbb;margin-right:7px}.dot.ok{background:var(--green)}.dot.warn{background:var(--yellow)}.layout{display:grid;grid-template-columns:1.04fr .96fr;gap:22px;align-items:start}.panel{background:var(--panel);backdrop-filter:blur(18px);border:1px solid rgba(0,0,0,.06);border-radius:20px;box-shadow:var(--shadow);padding:24px}.label{font-size:12px;font-weight:700;color:#6e6e73;margin-bottom:10px;letter-spacing:.01em}.variant{display:grid;grid-template-columns:1fr 1fr;background:#ececf0;border-radius:12px;padding:4px;gap:4px;margin-bottom:24px}.variant button{border:0;background:transparent;height:42px;border-radius:9px;font:inherit;font-size:13px;font-weight:650;color:#6e6e73;cursor:pointer;transition:.18s ease}.variant button.active{background:#fff;color:#1d1d1f;box-shadow:0 2px 8px rgba(0,0,0,.08)}.field{background:#fbfbfd;border:1px solid #eceef1;border-radius:14px;padding:16px;margin-top:30px;position:relative}.field:first-of-type{margin-top:4px}.field+.field{margin-top:18px}.fieldhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.fieldtools{display:flex;align-items:center;gap:8px}.switchwrap{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}.switch{position:relative;width:38px;height:22px;display:inline-block;flex:0 0 auto}.switch input{position:absolute;opacity:0;width:0;height:0;padding:0;margin:0;pointer-events:none}.slider{position:absolute;inset:0;background:#d1d1d6;border-radius:999px;cursor:pointer;transition:.18s}.slider:before{content:'';position:absolute;width:18px;height:18px;left:2px;top:2px;background:#fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.18);transition:.18s}.switch input:checked+.slider{background:var(--blue)}.switch input:checked+.slider:before{transform:translateX(16px)}.amountbox{margin-top:10px;padding:11px;border-radius:11px;background:#f2f4f7;border:1px solid #e4e7eb}.amountbox.hidden{display:none!important}.amountlabel{font-size:11px;color:#7b7f86;margin-bottom:6px;font-weight:600}.name{font-size:14px;font-weight:700;color:var(--text)}textarea,input:not([type="checkbox"]){width:100%;border:1px solid #d7dbe0;border-radius:11px;background:#fff;outline:none;font:inherit;color:var(--text);transition:.16s ease}textarea{min-height:84px;padding:12px 14px;resize:vertical;line-height:1.5}input:not([type="checkbox"]){height:42px;padding:0 12px}textarea:focus,input:not([type="checkbox"]):focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,132,255,.12)}.meta{display:flex;justify-content:space-between;gap:12px;margin-top:9px;font-size:11px;color:#7b7f86}.state{font-weight:700}.state.safe{color:var(--green)}.state.warn{color:var(--yellow)}.state.bad{color:var(--red)}.summary{margin-top:20px;border-radius:14px;padding:14px 15px;display:flex;align-items:center;justify-content:space-between;border:1px solid transparent}.summary.safe{background:var(--greenbg);border-color:#d8ebdf}.summary.warn{background:var(--yellowbg);border-color:#f0dfad}.summary.bad{background:var(--redbg);border-color:#efd0d0}.sumtitle{font-size:13px;font-weight:700}.sumicon{font-size:18px;font-weight:700}.phoneWrap{display:flex;justify-content:center}.phone{width:390px;height:844px;position:relative;overflow:hidden;border-radius:24px;background:#000;box-shadow:0 16px 40px rgba(0,0,0,.14);font-family:"TikTok Sense","TikTok Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.phone img.base{position:absolute;inset:0;width:390px;height:844px;object-fit:cover;display:block;image-rendering:auto}.hidden{display:none!important}@media(max-width:940px){.layout{grid-template-columns:1fr}.phone{transform:scale(.9);transform-origin:top center;margin-bottom:-84px}.app{padding:16px}}.dynamicContent{position:absolute;left:16px;width:358px;bottom:143px;display:flex;flex-direction:column;gap:16px;z-index:4}.dynamicTextBlock{padding:0 8px;display:flex;flex-direction:column;gap:12px}.dynamicTitle{width:342px;font-size:28px;line-height:1.2;font-weight:700;color:#fff;overflow:hidden}.dynamicTitle.max2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}.dynamicTitle .reward{color:#f4f300}.dynamicSub{width:342px;font-size:13px;line-height:1.3;font-weight:400;color:rgba(255,255,255,.6);overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}.dynamicSlot{width:358px;min-height:100px;border-radius:18px;background:rgba(255,255,255,.12);border:.5px solid rgba(255,255,255,.09);display:flex;align-items:center;padding:10px 16px;gap:16px}.dynamicSlotIcon{width:80px;height:80px;flex:0 0 80px;display:grid;place-items:center}.dynamicSlotIcon img{width:59px;height:59px;object-fit:contain;display:block}.dynamicSlotCopy{width:230px;min-width:0}.dynamicSlotTitle{width:190px;font-size:17px;line-height:1.3;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dynamicSlotSub{width:230px;margin-top:8px;font-size:13px;line-height:1.3;font-weight:400;color:rgba(255,255,255,.6);overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}.dynamicButtons{width:358px;height:52px;display:flex;gap:10px}.dynamicBtn{width:174px;height:52px;border-radius:26px;display:grid;place-items:center;font-size:16px;font-weight:600}.dynamicBtn.secondary{color:rgba(255,255,255,.8);background:rgba(255,255,255,.15)}.dynamicBtn.primary{color:#000;background:#f4f300}.dynamicZoneMask{position:absolute;left:0;right:0;top:430px;bottom:83px;z-index:2;background:radial-gradient(circle at 72% 84%,rgba(104,182,0,.20),transparent 34%),linear-gradient(180deg,rgba(0,0,0,.985) 0%,rgba(0,0,0,.98) 48%,rgba(7,18,0,.95) 100%);pointer-events:none}.dynamicArrow{position:absolute;left:185px;bottom:97px;width:20px;height:20px;z-index:5}.dynamicArrow img{display:block;width:20px;height:20px;object-fit:contain}#measureRoot{position:absolute;left:-99999px;top:-99999px;visibility:hidden;pointer-events:none;contain:layout style paint}.measureBox{display:block;white-space:normal;word-break:break-word;overflow-wrap:anywhere;padding:0;margin:0;border:0;box-sizing:border-box}
</style>
</head>
<body>
<div class="app"><div class="head"><div><h1>文案适配检查</h1><div class="sub">输入文案，即时检查长度、行数与真实展示效果</div></div><div id="fontStateWrap" class="fontstate"><span id="fontDot" class="dot"></span><span id="fontText">检测字体…</span></div></div><div class="layout"><div class="panel"><div class="variant"><button id="slotBtn" class="active">带卖点组件</button><button id="basicBtn">基础版</button></div><div class="field"><div class="fieldhead"><div class="name">主标题</div><div class="fieldtools"><div class="switchwrap"><span>金额</span><label class="switch"><input id="mainAmountOn" type="checkbox" checked><span class="slider"></span></label></div></div></div><textarea id="mainTitle">Easter Carnival! Claim your {reward} Reward.</textarea><div id="mainAmountBox" class="amountbox"><div class="amountlabel">主标题金额</div><input id="mainAmount" value="R$100" placeholder="例如 R$100 / $50 / 10,000원"/></div><div class="meta"><span id="mainMetric"></span><span id="mainState" class="state"></span></div></div><div id="subtitleField" class="field hidden"><div class="fieldhead"><div class="name">副标题</div><div class="fieldtools"><div class="switchwrap"><span>金额</span><label class="switch"><input id="subAmountOn" type="checkbox" checked><span class="slider"></span></label></div></div></div><textarea id="subtitle">Join the Easter Football Challenge &amp; Win {reward}!</textarea><div id="subAmountBox" class="amountbox"><div class="amountlabel">副标题金额</div><input id="subAmount" value="R$100" placeholder="例如 R$100 / $50 / 10,000원"/></div><div class="meta"><span id="subMetric"></span><span id="subState" class="state"></span></div></div><div id="slotTitleField" class="field"><div class="fieldhead"><div class="name">卖点主标题</div><div class="fieldtools"><div class="switchwrap"><span>金额</span><label class="switch"><input id="slotTitleAmountOn" type="checkbox"><span class="slider"></span></label></div></div></div><input id="slotTitle" value="Invite your friends"/><div id="slotTitleAmountBox" class="amountbox hidden"><div class="amountlabel">卖点主标题金额</div><input id="slotTitleAmount" value="R$100" placeholder="例如 R$100 / $50 / 10,000원"/></div><div class="meta"><span id="slotTitleMetric"></span><span id="slotTitleState" class="state"></span></div></div><div id="slotSubField" class="field"><div class="fieldhead"><div class="name">卖点副标题</div><div class="fieldtools"><div class="switchwrap"><span>金额</span><label class="switch"><input id="slotSubAmountOn" type="checkbox" checked><span class="slider"></span></label></div></div></div><textarea id="slotSub">Invite 1 friend,get 1 reward. Earn {reward}, cash out easily!</textarea><div id="slotSubAmountBox" class="amountbox"><div class="amountlabel">卖点副标题金额</div><input id="slotSubAmount" value="R$100" placeholder="例如 R$100 / $50 / 10,000원"/></div><div class="meta"><span id="slotSubMetric"></span><span id="slotSubState" class="state"></span></div></div><div id="summary" class="summary safe"><div id="sumTitle" class="sumtitle">全部安全</div><div id="sumIcon" class="sumicon">✓</div></div></div><div class="panel"><div class="label">实时预览</div><div class="phoneWrap"><div class="phone"><img id="baseSlot" class="base" src="https://www.figma.com/api/mcp/asset/22b6ad1c-6a83-4a45-8185-0f267ab0039f.png" alt=""><img id="baseBasic" class="base hidden" src="https://www.figma.com/api/mcp/asset/7060a2a0-e9e3-4a23-8a3d-d26a362a04db.png" alt=""><div class="dynamicZoneMask"></div><div class="dynamicArrow"><img src="https://www.figma.com/api/mcp/asset/fc0bddf0-be38-4fc5-a863-de9d27eab6de.svg" alt=""></div><div id="dynamicContent" class="dynamicContent"><div class="dynamicTextBlock"><div id="pvMain" class="dynamicTitle max2"></div><div id="pvSub" class="dynamicSub hidden"></div></div><div id="pvSlot" class="dynamicSlot"><div class="dynamicSlotIcon"><img src="https://www.figma.com/api/mcp/asset/fc8cc3cc-f1f3-4f7e-8ea3-05821a4adc35.png" alt=""></div><div class="dynamicSlotCopy"><div id="pvSlotTitle" class="dynamicSlotTitle"></div><div id="pvSlotSub" class="dynamicSlotSub"></div></div></div><div class="dynamicButtons"><div class="dynamicBtn secondary">Not interested</div><div class="dynamicBtn primary">Join now</div></div></div></div></div></div></div></div><div id="measureRoot"></div><canvas id="measure" width="10" height="10" style="display:none"></canvas>
<script>
const SPECS={main:{font:"TikTok Sense",size:28,weight:700,width:342,maxLines:2,maxA:44,lineHeight:1.2},sub:{font:"TikTok Sense",size:13,weight:400,width:342,maxLines:2,maxA:92,lineHeight:1.3},slotTitle:{font:"TikTok Sense",size:17,weight:700,width:190,maxLines:1,maxA:22,lineHeight:1.3},slotSub:{font:"TikTok Sense",size:13,weight:400,width:230,maxLines:2,maxA:62,lineHeight:1.3}};let mode="slot";const $=id=>document.getElementById(id),ctx=$("measure").getContext("2d");function fontStr(s){return `${s.weight} ${s.size}px "${s.font}"`}function measure(text,s){ctx.font=fontStr(s);return ctx.measureText(text).width}function realLayoutMetrics(text,s){const root=$("measureRoot"),box=document.createElement("div");box.className="measureBox";box.style.width=s.width+"px";box.style.fontFamily='"'+s.font+'","TikTok Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';box.style.fontSize=s.size+"px";box.style.fontWeight=String(s.weight);box.style.lineHeight=String(s.lineHeight||1.3);box.style.letterSpacing="0px";box.textContent=text||"\u200b";root.appendChild(box);const cs=getComputedStyle(box),lineHeight=parseFloat(cs.lineHeight)||(s.size*(s.lineHeight||1.3)),height=box.getBoundingClientRect().height,lineCount=Math.max(1,Math.round(height/lineHeight));root.removeChild(box);return{lineCount,height,lineHeight}}const AMOUNT_MAP={mainTitle:{toggle:"mainAmountOn",input:"mainAmount"},subtitle:{toggle:"subAmountOn",input:"subAmount"},slotTitle:{toggle:"slotTitleAmountOn",input:"slotTitleAmount"},slotSub:{toggle:"slotSubAmountOn",input:"slotSubAmount"}};function amountFor(id){const m=AMOUNT_MAP[id];return m&&$(m.toggle).checked?($(m.input).value||""):""}function finalText(id){return($(id).value||"").split("{reward}").join(amountFor(id))}function check(id,s){const text=finalText(id),w=measure(text,s),a=Math.max(measure("a",s),.01),eq=w/a,lm=realLayoutMetrics(text,s),l=lm.lineCount;let level="safe",label="安全",reason="";if(l>s.maxLines){level="bad";label=`超出 ${s.maxLines} 行`;reason=`真实排版为 ${l} 行`}else if(eq>s.maxA){level="bad";label="超出上限";reason=`等效长度超过 ${s.maxA}a`}else if(eq>s.maxA*.82){level="warn";label="接近上限";reason="仍可展示，但建议缩短"}return{text,w,eq,l,level,label,reason,lm}}function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}function rich(text,id){const r=amountFor(id);if(!r)return esc(text);return esc(text).split(esc(r)).join(`<span class="reward">${esc(r)}</span>`)}function field(metric,state,res,s){$(metric).textContent=`${res.eq.toFixed(1)}a / ${s.maxA}a · 真实排版 ${res.l}/${s.maxLines} 行`;$(state).className=`state ${res.level}`;$(state).textContent=res.label}function update(){const m=check("mainTitle",SPECS.main),sb=check("subtitle",SPECS.sub),st=check("slotTitle",SPECS.slotTitle),ss=check("slotSub",SPECS.slotSub);field("mainMetric","mainState",m,SPECS.main);field("subMetric","subState",sb,SPECS.sub);field("slotTitleMetric","slotTitleState",st,SPECS.slotTitle);field("slotSubMetric","slotSubState",ss,SPECS.slotSub);$("pvMain").innerHTML=rich(m.text,"mainTitle");$("pvSub").innerHTML=rich(sb.text,"subtitle");$("pvSlotTitle").innerHTML=rich(st.text,"slotTitle");$("pvSlotSub").innerHTML=rich(ss.text,"slotSub");const active=mode==="slot"?[m,st,ss]:[m,sb],level=active.some(x=>x.level==="bad")?"bad":active.some(x=>x.level==="warn")?"warn":"safe";$("summary").className=`summary ${level}`;if(level==="safe"){$("sumTitle").textContent="全部安全";$("sumIcon").textContent="✓"}if(level==="warn"){$("sumTitle").textContent="接近上限";$("sumIcon").textContent="!"}if(level==="bad"){$("sumTitle").textContent="存在超限文案";$("sumIcon").textContent="!"}}function setMode(m){mode=m;$("slotBtn").classList.toggle("active",m==="slot");$("basicBtn").classList.toggle("active",m==="basic");["slotTitleField","slotSubField","baseSlot","pvSlot"].forEach(id=>$(id).classList.toggle("hidden",m!=="slot"));["subtitleField","baseBasic","pvSub"].forEach(id=>$(id).classList.toggle("hidden",m!=="basic"));$("pvMain").className="dynamicTitle max2";update()}["mainTitle","subtitle","slotTitle","slotSub","mainAmount","subAmount","slotTitleAmount","slotSubAmount"].forEach(id=>$(id).addEventListener("input",update));["mainAmountOn","subAmountOn","slotTitleAmountOn","slotSubAmountOn"].forEach(id=>{$(id).addEventListener("change",()=>{const boxId={mainAmountOn:"mainAmountBox",subAmountOn:"subAmountBox",slotTitleAmountOn:"slotTitleAmountBox",slotSubAmountOn:"slotSubAmountBox"}[id];$(boxId).classList.toggle("hidden",!$(id).checked);update()})});$("slotBtn").onclick=()=>setMode("slot");$("basicBtn").onclick=()=>setMode("basic");function detect(){const ok=document.fonts?.check?.('16px "TikTok Sense"');if(ok){$("fontStateWrap").style.display="none"}else{$("fontStateWrap").style.display="block";$("fontDot").className="dot warn";$("fontText").textContent="未检测到 TikTok Sense"}}document.fonts?.ready?.then(()=>{detect();update()});setMode("slot");
</script>
</body>
</html>
