<svg xmlns="http://www.w3.org/2000/svg" width="300" height="360" viewBox="0 0 300 360">
  <defs>
    <!-- Each cylinder gets its own cross-sectional lighting. -->
    <linearGradient id="upright" x1="0" x2="1" y1="0" y2="0">
      <stop stop-color="#bb7605"/><stop offset=".12" stop-color="#ffe78d"/>
      <stop offset=".25" stop-color="#fffbd0"/><stop offset=".37" stop-color="#ffe451"/>
      <stop offset=".58" stop-color="#ffcc1c"/><stop offset=".81" stop-color="#eea008"/>
      <stop offset=".94" stop-color="#b96703"/><stop offset="1" stop-color="#ffdb64"/>
    </linearGradient>
    <linearGradient id="crossbar" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#e5a01b"/><stop offset=".13" stop-color="#fffcca"/>
      <stop offset=".3" stop-color="#ffe967"/><stop offset=".48" stop-color="#ffd026"/>
      <stop offset=".7" stop-color="#f5b00d"/><stop offset=".9" stop-color="#c47a06"/>
      <stop offset="1" stop-color="#8b4e05"/>
    </linearGradient>
    <radialGradient id="elbow" cx=".31" cy=".22" r=".82">
      <stop stop-color="#fffde0"/><stop offset=".32" stop-color="#ffea6d"/>
      <stop offset=".63" stop-color="#ffc120"/><stop offset=".86" stop-color="#d58b08"/>
      <stop offset="1" stop-color="#95530b"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2=".4" y2="1">
      <stop stop-color="#fffef0"/><stop offset=".5" stop-color="#fff09b"/><stop offset="1" stop-color="#d08a17"/>
    </linearGradient>
    <linearGradient id="reflection" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".78"/><stop offset=".23" stop-color="#ffffff" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".48"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="joint" x1="0" x2="1" y1="0" y2="0">
      <stop stop-color="#9e5b05"/><stop offset=".13" stop-color="#f5bc32"/>
      <stop offset=".3" stop-color="#fffac1"/><stop offset=".49" stop-color="#ffe56b"/>
      <stop offset=".73" stop-color="#edac17"/><stop offset="1" stop-color="#b56b08"/>
    </linearGradient>
    <filter id="bloom" x="-25%" y="-10%" width="150%" height="120%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <path d="M19 10V329Q19 341 31 341H269Q281 341 281 329V10" fill="none" stroke="#ffce36" stroke-width="25" opacity=".12" filter="url(#bloom)"/>
  <!-- Inner edges remain x=30 / 270, preserving the gameplay bounds. -->
  <rect x="8" y="10" width="22" height="320" fill="url(#upright)"/>
  <rect x="270" y="10" width="22" height="320" fill="url(#upright)"/>
  <path d="M13 15V324M275 15V324" fill="none" stroke="url(#reflection)" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M29 22V319M291 22V319" fill="none" stroke="#8fcfff" stroke-opacity=".45" stroke-width=".8"/>
  <ellipse cx="19" cy="10" rx="11" ry="5.5" fill="url(#cap)"/>
  <ellipse cx="281" cy="10" rx="11" ry="5.5" fill="url(#cap)"/>
  <path d="M10 8Q19 2 28 8M272 8Q281 2 290 8" fill="none" stroke="#ffffdf" stroke-width="1.1" opacity=".9"/>
  <path d="M8 319H30V328Q30 330 33 330H43V352H28Q8 352 8 333Z" fill="url(#elbow)"/>
  <path d="M292 319H270V328Q270 330 267 330H257V352H272Q292 352 292 333Z" fill="url(#elbow)"/>
  <rect x="30" y="330" width="240" height="22" fill="url(#crossbar)"/>
  <path d="M12 320V331Q12 337 18 337M288 320V331Q288 337 282 337" fill="none" stroke="#ffef96" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M32 333H268" stroke="#fffde2" stroke-opacity=".8" stroke-width="1.5"/>
  <path d="M33 350H268" stroke="#713f07" stroke-opacity=".42" stroke-width="1"/>
  <!-- Raised sleeve and contact shadow connect the bar to the support. -->
  <rect x="137" y="329" width="30" height="23" rx="4" fill="#7a4809" opacity=".28"/>
  <rect x="136" y="325" width="28" height="30" rx="6" fill="url(#joint)"/>
  <ellipse cx="150" cy="328" rx="12" ry="3.5" fill="url(#cap)"/>
  <path d="M140 332V348" stroke="#fff5ad" stroke-width="1.3" opacity=".7"/>
  <path d="M161 333V349" stroke="#995a06" stroke-width="1" opacity=".65"/>
  <path d="M144 352Q150 354 157 352" fill="none" stroke="#9a5804" stroke-width="1"/>
</svg>
