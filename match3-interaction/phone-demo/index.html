<!doctype html>

        </div>

    </footer>
  </main>

: 0;\n      top: 176px;\n      width: 171px;\n      height: 24px;\n      border-radius: 0 8px 8px 0;\n      background: rgba(249,248,243,.94);\n      display: flex;\n      align-items: center;\n      padding-left: 31px;\n      color: #1f1f1f;\n      font-size: 12px;\n      font-weight: 500;\n      white-space: nowrap;\n    }\n\n    .tile {\n      position: relative;\n      width: var(--tile-size);\n      height: var(--tile-size);\n      border: 0;\n      padding: 0;\n      border-radius: 8px;\n      box-shadow: inset 0 -3px 0 rgba(0,0,0,.16);\n      cursor: pointer;\n      transition: transform .12s ease, filter .12s ease, box-shadow .12s ease;\n      color: rgba(0,0,0,.58);\n      font-size: 18px;\n      font-weight: 900;\n      line-height: 1;\n    }\n\n    .tile::before {\n      content: \"\";\n      position: absolute;\n      inset: -3px;\n      border-radius: 10px;\n    }\n\n    .tile[data-type=\"a\"] { background: #ffdf5a; }\n    .tile[data-type=\"b\"] { background: #ff7a89; }\n    .tile[data-type=\"c\"] { background: #5bd8ff; }\n    .tile[data-type=\"d\"] { background: #80e27e; }\n    .tile[data-type=\"e\"] { background: #c68cff; }\n    .tile[data-type=\"f\"] { background: #ffb35a; }\n    .tile[data-type=\"g\"] { background: #72e4c5; }\n    .tile[data-type=\"h\"] { background: #f79ee2; }\n    .tile[data-type=\"i\"] { background: #a3d65c; }\n    .tile[data-type=\"j\"] { background: #8db5ff; }\n    .tile[data-type=\"k\"] { background: #ffd16e; }\n    .tile[data-type=\"l\"] { background: #e59bff; }\n    .tile[data-type=\"m\"] { background: #b8d8ff; }\n    .tile[data-type=\"n\"] { background: #ff9f6e; }\n    .tile[data-type=\"o\"] { background: #b6ee8f; }\n    .tile[data-type=\"p\"] { background: #ff8fc7; }\n\n    .tile.is-selected {\n      transform: scale(.92);\n      filter: brightness(1.1);\n      box-shadow: 0 0 0 3px rgba(255,255,255,.86), inset 0 -3px 0 rgba(0,0,0,.16);\n    }\n\n    .tile.is-hint {\n      animation: pulseHint .72s ease-in-out infinite alt     \u003cp>45秒内消除 20 组，收纳栏满就失败。\u003c/p>\n      \u003cbutton class=\"home-start\" id=\"homeStartBtn\" type=\"button\">开始游戏\u003c/button>\n    \u003c/section>\n\n    \u003csection class=\"modal\" id=\"pauseModal\" aria-label=\"暂停弹窗\">\n      \u003cdiv class=\"modal-card pause-card\">\n        \u003cdiv class=\"modal-top-image\" aria-hidden=\"true\">\n          \u003cimg class=\"modal-art\" src=\"./assets/modal/pause-popup.png\" alt=\"\" />\n        \u003c/div>\n        \u003cdiv class=\"pause-settings\" aria-label=\"设置项\">\n          \u003cdiv class=\"pause-row\">\n            \u003cspan class=\"pause-row-label\">\n              \u003cimg class=\"pause-row-icon\" src=\"./assets/pause/sfx.png\" alt=\"\" />\n              音效\n            \u003c/span>\n            \u003cbutton class=\"switch\" id=\"sfxSwitch\" type=\"button\" aria-label=\"音效开关\">\u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"pause-row\">\n            \u003cspan class=\"pause-row-label\">\n              \u003cimg class=\"pause-row-icon\" src=\"./assets/pause/music.png\" alt=\"\" />\n              音乐\n            \u003c/span>\n            \u003cbutton class=\"switch\" id=\"musicSwitch\" type=\"button\" aria-label=\"音乐开关\">\u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"pause-row\">\n            \u003cspan class=\"pause-row-label\">\n              \u003cimg class=\"pause-row-icon\" src=\"./assets/pause/vibration.png\" alt=\"\" />\n              震动\n            \u003c/span>\n            \u003cbutton class=\"switch\" id=\"vibrationSwitch\" type=\"button\" aria-label=\"震动开关\">\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"pause-buttons\">\n          \u003cbutton class=\"modal-action\" id=\"resumeBtn\" type=\"button\">继续\u003c/button>\n          \u003cbutton class=\"modal-secondary-action\" id=\"abandonBtn\" type=\"button\">放弃挑战\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"modal\" id=\"resultModal\" aria-label=\"结算弹窗\">\n      \u003cdiv class=\"modal-card settlement-card success\" id=\"resultCard\">\n        \u003cbutton class=\"modal-close\" id=\"resultCloseBtn\" type=\"button\" aria-label=\"关闭\">\u003c/button>\n        \u003cdiv class=\"modal-top-image\" aria-hidden=\"true\">\n          \u003cimg class=\"modal-art\" id=\"resultArt\" src=\"./assets/modal/challenge-success.png\" alt=\"\" />\n        \u003c/div>\n        \u003cdiv class=\"settlement-copy\">\n          \u003ch2 class=\"modal-title\" id=\"resultTitle\">挑战成功\u003c/h2>\n          \u003cp class=\"modal-message\" id=\"resultDesc\">你完成了本轮目标\u003c/p>\n          \u003cdiv class=\"benefit\" id=\"resultBenefit\">\n            \u003cspan>+\u003c/span>\n            \u003cimg class=\"benefit-coin\" src=\"./assets/modal/coin-icon.png\" alt=\"\" />\n            \u003cspan id=\"resultBenefitValue\">120\u003c/span>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"settlement-button-area\">\n          \u003cbutton class=\"modal-action\" id=\"restartBtn\" type=\"button\">再来一局\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cscript>\n    const board = document.getElementById('board');\n    const goalText = document.getElementById('goalText');\n    const resultModal = document.getElementById('resultModal');\n    const resultCard = document.getElementById('resultCard');\n    const resultTitle = document.getElementById('resultTitle');\n    const resultDesc = document.getElementById('resultDesc');\n    const resultBenefit = document.getElementById('resultBenefit');\n    const resultBenefitValue = document.getElementById('resultBenefitValue');\n    const resultArt = document.getElementById('resultArt');\n    const resultCloseBtn = document.getElementById('resultCloseBtn');\n    const restartBtn = document.getElementById('restartBtn');\n    const homeScreen = document.getElementById('homeScreen');\n    const homeStartBtn = document.getElementById('homeStartBtn');\n    const acquiredPoints = document.getElementById('acquiredPoints');\n    const slotEls = [...document.querySelectorAll('.candidate-slot')];\n    const returnBadge = document.getElementById('returnBadge');\n    const hintBadge = document.getElementById('hintBadge');\n    const timeBadge = document.getElementById('timeBadge');\n    const TARGET_GROUPS = 20;\n    const POINTS_PER_GROUP = 6;\n    const ROUND_SECONDS = 45;\n    const ADD_TIME_SECONDS = 8;\n    const symbols = {\n      a: '?', b: '?', c: '?', d: '?', e: '?', f: '?',\n      g: '?', h: '?', i: '?', j: '?'\n    };\n\n    let tiles = [];\n    let tray = [];\n    let lastMove = null;\n    let groupsCleared = 0;\n    let earnedPoints = 0;\n    let locked = false;\n    // 交互版：默认可玩（完整交互）；加 ?guide=1 可临时预览无交互冻结态\n    const _modeParams = new URLSearchParams(location.search);\n    const GUIDE_MODE = _modeParams.get('guide') === '1';\n    if (GUIDE_MODE) document.body.classList.add('guide-mode');\n    let resolvingMatch = false;\n    let matchResolveTimer = null;\n    let lastTileTapAt = 0;\n    let timeLeft = ROUND_SECONDS;\n    let timerId = null;\n    let boosterCounts = { return: 6, hint: 2, time: 1 };\n    const mediaState = { sfx: true, music: true, vibration: true };\n    const BGM_VOLUME = 0.018;\n    const BGM_FADE_MS = 700;\n    const BGM_LOOP_FADE_SECONDS = 1.2;\n    let audioContext = null;\n    let audioUnlocked = false;\n    let bgmAudio = null;\n    let bgmFadeTimer = null;\n    let bgmLoopRestarting = false;\n    let bgmPlayRequested = false;\n\n    function ensureAudioContext() {\n      if (!audioContext) {\n        audioContext = new (window.AudioContext || window.webkitAudioContext)();\n      }\n      if (audioContext.state === 'suspended') {\n        audioContext.resume();\n      }\n      return audioContext;\n    }\n\n    function unlockAudio() {\n      if (audioUnlocked) return;\n      try {\n        const ctx = ensureAudioContext();\n        const oscillator = ctx.createOscillator();\n        const gain = ctx.createGain();\n        gain.gain.setValueAtTime(0.00001, ctx.currentTime);\n        oscillator.frequency.setValueAtTime(1, ctx.currentTime);\n        oscillator.connect(gain).connect(ctx.destination);\n        oscillator.start();\n        oscillator.stop(ctx.currentTime + 0.01);\n        audioUnlocked = true;\n      } catch (error) {\n        // Some browsers still wait for a stronger user gesture; the next tap retries.\n      }\n    }\n\n    function playTone(frequency, duration = 0.09, delay = 0, gainValue = 0.035) {\n      if (!mediaState.sfx) return;\n      const ctx = ensureAudioContext();\n      if (ctx.state === 'suspended') return;\n      const oscillator = ctx.createOscillator();\n      const gain = ctx.createGain();\n      const startAt = ctx.currentTime + delay;\n      oscillator.type = 'triangle';\n      oscillator.frequency.setValueAtTime(frequency, startAt);\n      gain.gain.setValueAtTime(0, startAt);\n      gain.gain.linearRampToValueAtTime(gainValue, startAt + 0.012);\n      gain.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);\n      oscillator.connect(gain).connect(ctx.destination);\n      oscillator.start(startAt);\n      oscillator.stop(startAt + duration + 0.02);\n    }\n\n    function startMusic() {\n      if (!mediaState.music) return;\n      if (!bgmAudio) {\n        bgmAudio = document.createElement('video');\n        bgmAudio.src = './assets/audio/bgm.mov';\n        bgmAudio.loop = false;\n        bgmAudio.preload = 'auto';\n        bgmAudio.playsInline = true;\n        bgmAudio.setAttribute('playsinline', '');\n        bgmAudio.style.display = 'none';\n        bgmAudio.volume = 0;\n        bgmAudio.addEventListener('timeupdate', handleMusicLoopFade);\n        bgmAudio.addEventListener('ended', restartMusicLoop);\n        document.body.appendChild(bgmAudio);\n      }\n      if (!bgmAudio.paused && bgmAudio.volume > 0 && !bgmLoopRestarting) return;\n      if (bgmPlayRequested && !bgmAudio.paused && !bgmLoopRestarting) return;\n      if (!Number.isFinite(bgmAudio.duration) || bgmAudio.duration - bgmAudio.currentTime > BGM_LOOP_FADE_SECONDS) {\n        bgmLoopRestarting = false;\n      }\n      window.clearInterval(bgmFadeTimer);\n      bgmPlayRequested = true;\n      bgmAudio.play().then(() => {\n        bgmPlayRequested = false;\n        fadeMusicTo(BGM_VOLUME, BGM_FADE_MS);\n      }).catch(() => {\n        bgmPlayRequested = false;\n      });\n    }\n\n    function requestMusicStart() {\n      if (GUIDE_MODE) return;\n      if (!mediaState.music) return;\n      try {\n        startMusic();\n      } catch (error) {\n        // Mobile browsers may block audio until the first user gesture.\n      }\n    }\n\n    function fadeMusicTo(targetVolume, duration = 500, pauseAtEnd = false, resetAtEnd = false) {\n      if (!bgmAudio) return;\n      window.clearInterval(bgmFadeTimer);\n      const startVolume = bgmAudio.volume;\n      const startedAt = performance.now();\n      bgmFadeTimer = window.setInterval(() => {\n        const progress = Math.min((performance.now() - startedAt) / duration, 1);\n        bgmAudio.volume = startVolume + (targetVolume - startVolume) * progress;\n        if (progress >= 1) {\n          window.clearInterval(bgmFadeTimer);\n          if (pauseAtEnd) bgmAudio.pause();\n          if (resetAtEnd) bgmAudio.currentTime = 0;\n        }\n      }, 40);\n    }\n\n    function stopMusic(resetAtEnd = false) {\n      if (!bgmAudio) return;\n      bgmLoopRestarting = false;\n      bgmPlayRequested = false;\n      if (bgmAudio.paused) {\n        if (resetAtEnd) bgmAudio.currentTime = 0;\n        return;\n      }\n      fadeMusicTo(0, 500, true, resetAtEnd);\n    }\n\n    function handleMusicLoopFade() {\n      if (!bgmAudio || !mediaState.music || bgmLoopRestarting || !Number.isFinite(bgmAudio.duration)) return;\n      if (bgmAudio.duration - bgmAudio.currentTime \u003c= BGM_LOOP_FADE_SECONDS) {\n        bgmLoopRestarting = true;\n        fadeMusicTo(0, 500);\n      }\n    }\n\n    function restartMusicLoop() {\n      if (!bgmAudio || !mediaState.music) return;\n      bgmAudio.currentTime = 0;\n      bgmAudio.volume = 0;\n      bgmAudio.play().then(() => {\n        bgmLoopRestarting = false;\n        bgmPlayRequested = false;\n        fadeMusicTo(BGM_VOLUME, BGM_FADE_MS);\n      }).catch(() => {\n        bgmLoopRestarting = false;\n        bgmPlayRequested = false;\n      });\n    }\n\n    function playMatchFeedback() {\n      playTone(523.25, 0.08, 0, 0.04);\n      playTone(783.99, 0.1, 0.07, 0.035);\n      if (mediaState.vibration && navigator.vibrate) {\n        navigator.vibrate(28);\n      }\n    }\n\n    function shuffle(array) {\n      const copy = [...array];\n      for (let i = copy.length - 1; i > 0; i--) {\n        const j = Math.floor(Math.random() * (i + 1));\n        [copy[i], copy[j]] = [copy[j], copy[i]];\n      }\n      return copy;\n    }\n\n    function seededShuffle(array, seed) {\n      const copy = [...array];\n      let s = seed >>> 0;\n      const rnd = () => {\n        s = (s + 0x6D2B79F5) >>> 0;\n        let t = s;\n        t = Math.imul(t ^ (t >>> 15), t | 1);\n        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);\n        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n      };\n      for (let i = copy.length - 1; i > 0; i--) {\n        const j = Math.floor(rnd() * (i + 1));\n        [copy[i], copy[j]] = [copy[j], copy[i]];\n      }\n      return copy;\n    }\n\n    function randomType() {\n      const types = Object.keys(symbols);\n      return types[Math.floor(Math.random() * types.length)];\n    }\n\n    const BOARD_CAPACITY = 30;\n\n    function makeDeck() {\n      const types = Object.keys(symbols);\n      const groupCount = Math.floor(BOARD_CAPACITY / 3);\n      const groups = [];\n      for (let i = 0; i \u003c groupCount; i++) {\n        groups.push(i \u003c types.length ? types[i] : types[Math.floor(Math.random() * types.length)]);\n      }\n      const deck = groups.flatMap(type => [type, type, type]);\n      return GUIDE_MODE ? seededShuffle(deck, 20260714) : shuffle(deck);\n    }\n\n    function updateBadges() {\n      returnBadge.textContent = boosterCounts.return > 0 ? boosterCounts.return : '+';\n      hintBadge.textContent = boosterCounts.hint > 0 ? boosterCounts.hint : '+';\n      timeBadge.textContent = boosterCounts.time > 0 ? boosterCounts.time : '+';\n    }\n\n    function updatePoints() {\n      acquiredPoints.textContent = String(earnedPoints);\n    }\n\n    function setTileVisual(el, type) {\n      el.textContent = '';\n      el.classList.remove('has-img');\n      const img = document.createElement('img');\n      img.alt = '';\n      img.draggable = false;\n      img.addEventListener('load', () => el.classList.add('has-img'));\n      img.addEventListener('error', () => {\n        img.remove();\n        el.classList.remove('has-img');\n        el.textContent = symbols[type];\n      });\n      img.src = `./assets/tiles/tile-${type}.png`;\n      el.appendChild(img);\n    }\n\n    function renderBoard() {\n      board.innerHTML = '';\n      tiles.forEach((item) => {\n        if (item.removed) {\n          const placeholder = document.createElement('div');\n          placeholder.className = 'tile-placeholder';\n          board.appendChild(placeholder);\n          return;\n        }\n        const tile = document.createElement('button');\n        tile.className = 'tile';\n        tile.type = 'button';\n        tile.dataset.type = item.type;\n        tile.dataset.id = item.id;\n        tile.draggable = false;\n        setTileVisual(tile, item.type);\n        tile.setAttribute('aria-label', `物品 ${symbols[item.type]}`);\n        bindPress(tile, (event) => takeTile(item.id, event.currentTarget));\n        board.appendChild(tile);\n      });\n    }\n\n    function renderTray(enteringId = null) {\n      slotEls.forEach((slot, index) => {\n        slot.innerHTML = '';\n        const item = tray[index];\n        if (!item) return;\n        const el = document.createElement('div');\n        el.className = 'tray-tile';\n        if (item.id === enteringId) el.classList.add('is-entering');\n        el.dataset.type = item.type;\n        el.dataset.id = item.id;\n        setTileVisual(el, item.type);\n        slot.appendChild(el);\n      });\n      goalText.textContent = `${groupsCleared}/${TARGET_GROUPS}`;\n      updatePoints();\n      updateBadges();\n    }\n\n    function getGroupedInsert(trayItems, item) {\n      const sameTypeLastIndex = trayItems.reduce((lastIndex, trayItem, index) => {\n        return trayItem.type === item.type ? index : lastIndex;\n      }, -1);\n      const insertIndex = sameTypeLastIndex >= 0 ? sameTypeLastIndex + 1 : trayItems.length;\n      const nextTray = [...trayItems];\n      nextTray.splice(insertIndex, 0, item);\n      return { nextTray, insertIndex };\n    }\n\n    function animateTileToSlot(sourceEl, item, slotIndex, compact = false) {\n      if (!sourceEl || !sourceEl.getBoundingClientRect || !window.Element.prototype.animate) {\n        return Promise.resolve();\n      }\n      const phone = document.querySelector('.phone');\n      const phoneRect = phone.getBoundingClientRect();\n      const from = sourceEl.getBoundingClientRect();\n      const to = slotEls[slotIndex].getBoundingClientRect();\n      const flyer = document.createElement('div');\n      flyer.className = 'flying-tile';\n      flyer.dataset.type = item.type;\n      setTileVisual(flyer, item.type);\n      flyer.style.left = `${from.left - phoneRect.left}px`;\n      flyer.style.top = `${from.top - phoneRect.top}px`;\n      flyer.style.width = `${from.width}px`;\n      flyer.style.height = `${from.height}px`;\n      phone.appendChild(flyer);\n      const deltaX = (to.left + to.width / 2) - (from.left + from.width / 2);\n      const deltaY = (to.top + to.height / 2) - (from.top + from.height / 2);\n      if (compact) {\n        const compactAnimation = flyer.animate([\n          { transform: 'translate(0, 0) scale(1)', opacity: .9 },\n          { transform: `translate(${deltaX}px, ${deltaY}px) scale(.96)`, opacity: 0 }\n        ], {\n          duration: 120,\n          easing: 'cubic-bezier(.2, .8, .2, 1)'\n        });\n        return compactAnimation.finished.catch(() => {}).finally(() => flyer.remove());\n      }\n      const animation = flyer.animate([\n        { transform: 'translate(0, 0) scale(1)', opacity: 1, offset: 0 },\n        { transform: `translate(${deltaX * .48}px, ${deltaY * .45 - 18}px) scale(1.06)`, opacity: 1, offset: .55 },\n        { transform: `translate(${deltaX}px, ${deltaY}px) scale(.92)`, opacity: 1, offset: .86 },\n        { transform: `translate(${deltaX}px, ${deltaY}px) scale(1)`, opacity: 0, offset: 1 }\n      ], {\n        duration: 210,\n        easing: 'cubic-bezier(.16, .95, .22, 1)'\n      });\n      return animation.finished.catch(() => {}).finally(() => flyer.remove());\n    }\n\n    function animateMerge(removeIndexes) {\n      return new Promise(resolve => {\n        const sorted = [...removeIndexes].sort((a, b) => a - b);\n        const centerIndex = sorted[1] ?? sorted[0];\n        sorted.forEach(index => {\n          const el = slotEls[index].querySelector('.tray-tile');\n          if (!el) return;\n          const distance = (centerIndex - index) * 52;\n          el.style.setProperty('--merge-x', `${distance}px`);\n          el.classList.add('is-merging');\n        });\n        window.setTimeout(resolve, 180);\n      });\n    }\n\n    function replaceTileWithPlaceholder(sourceEl) {\n      if (!sourceEl || !sourceEl.parentNode) return false;\n      const placeholder = document.createElement('div');\n      placeholder.className = 'tile-placeholder';\n      sourceEl.replaceWith(placeholder);\n      return true;\n    }\n\n    function scheduleResolveMatches() {\n      window.clearTimeout(matchResolveTimer);\n      matchResolveTimer = window.setTimeout(() => {\n        resolveMatches();\n      }, 70);\n    }\n\n    function takeTile(id, sourceEl) {\n      if (locked || resolvingMatch || tray.length >= 7) return;\n      const item = tiles.find(tile => tile.id === id);\n      if (!item || item.removed) return;\n      item.removed = true;\n      const trayItem = { id: item.id, type: item.type, originIndex: item.index };\n      const { nextTray, insertIndex } = getGroupedInsert(tray, trayItem);\n      lastMove = item;\n      clearHints();\n      sourceEl?.classList.add('is-selected');\n      const now = Date.now();\n      const compactMotion = now - lastTileTapAt \u003c 110;\n      lastTileTapAt = now;\n      animateTileToSlot(sourceEl, trayItem, insertIndex, compactMotion);\n      tray = nextTray;\n      if (!replaceTileWithPlaceholder(sourceEl)) renderBoard();\n      renderTray(trayItem.id);\n      scheduleResolveMatches();\n    }\n\n    async function resolveMatches() {\n      if (locked || resolvingMatch) return;\n      const byType = tray.reduce((map, item, index) => {\n        if (!map[item.type]) map[item.type] = [];\n        map[item.type].push(index);\n        return map;\n      }, {});\n      const matchType = Object.keys(byType).find(type => byType[type].length >= 3);\n      if (matchType) {\n        resolvingMatch = true;\n        const removeIndexes = byType[matchType].slice(0, 3);\n        await animateMerge(removeIndexes);\n        removeIndexes.forEach(index => {\n          const originIndex = tray[index].originIndex;\n          tiles[originIndex] = {\n            id: `tile-${Date.now()}-${originIndex}-${Math.random().toString(16).slice(2)}`,\n            index: originIndex,\n            type: randomType(),\n            removed: false\n          };\n        });\n        tray = tray.filter((_, index) => !removeIndexes.includes(index));\n        groupsCleared += 1;\n        earnedPoints += POINTS_PER_GROUP;\n        playMatchFeedback();\n        resolvingMatch = false;\n        renderBoard();\n        renderTray();\n        if (!checkEnd()) scheduleResolveMatches();\n        return;\n      }\n      checkEnd();\n    }\n\n    function checkEnd() {\n      if (groupsCleared >= TARGET_GROUPS) {\n        showResult(true);\n        return true;\n      }\n      if (tray.length >= 7) {\n        showResult(false);\n        return true;\n      }\n      return false;\n    }\n\n    function showResult(success) {\n      locked = true;\n      resolvingMatch = false;\n      window.clearTimeout(matchResolveTimer);\n      resultCard.classList.toggle('success', success);\n      resultCard.classList.toggle('failure', !success);\n      resultArt.src = success ? './assets/modal/challenge-success.png' : './assets/modal/challenge-failure.png';\n      resultTitle.textContent = success ? '挑战成功' : '挑战失败';\n      resultDesc.textContent = success ? '你完成了本轮消除目标' : (timeLeft \u003c= 0 ? '时间到了，试着更快找到三连组合' : '收纳栏已满，试着更有计划地选择物品');\n      resultBenefit.classList.toggle('is-hidden', !success);\n      resultBenefitValue.textContent = String(earnedPoints);\n      resultModal.classList.add('is-open');\n      stopTimer();\n    }\n\n    function returnToHome() {\n      stopTimer();\n      stopMusic(true);\n      locked = true;\n      resolvingMatch = false;\n      window.clearTimeout(matchResolveTimer);\n      resultModal.classList.remove('is-open');\n      pauseModal.classList.remove('is-open');\n      document.getElementById('pauseBtn').classList.remove('is-playing');\n      homeScreen.classList.add('is-open');\n    }\n\n    function resetGame() {\n      const deck = makeDeck();\n      tiles = deck.map((type, index) => ({ id: `tile-${Date.now()}-${index}`, index, type, removed: false }));\n      tray = [];\n      lastMove = null;\n      groupsCleared = 0;\n      earnedPoints = 0;\n      resolvingMatch = false;\n      lastTileTapAt = 0;\n      window.clearTimeout(matchResolveTimer);\n      timeLeft = ROUND_SECONDS;\n      boosterCounts = { return: 6, hint: 2, time: 1 };\n      locked = false;\n      resultModal.classList.remove('is-open');\n      pauseModal.classList.remove('is-open');\n      homeScreen.classList.remove('is-open');\n      document.getElementById('pauseBtn').classList.remove('is-playing');\n      renderBoard();\n      renderTray();\n      updatePoints();\n      updateTimer();\n      startTimer();\n      requestMusicStart();\n    }\n\n    function clearHints() {\n      board.querySelectorAll('.is-hint').forEach(el => el.classList.remove('is-hint'));\n    }\n\n    function findVisibleTriple() {\n      const visible = tiles.filter(tile => !tile.removed);\n      const grouped = visible.reduce((map, tile) => {\n        if (!map[tile.type]) map[tile.type] = [];\n        map[tile.type].push(tile.id);\n        return map;\n      }, {});\n      const type = Object.keys(grouped).find(key => grouped[key].length >= 3);\n      return type ? grouped[type].slice(0, 3) : [];\n    }\n\n    function showHint() {\n      clearHints();\n      findVisibleTriple().forEach(id => {\n        const el = board.querySelector(`[data-id=\"${id}\"]`);\n        if (el) el.classList.add('is-hint');\n      });\n      window.setTimeout(clearHints, 1800);\n    }\n\n    function returnLastThree() {\n      if (locked || resolvingMatch || boosterCounts.return \u003c= 0 || tray.length === 0) return;\n      window.clearTimeout(matchResolveTimer);\n      const returning = tray.splice(Math.max(0, tray.length - 3));\n      returning.forEach(item => {\n        const origin = tiles[item.originIndex];\n        if (origin) {\n          tiles[item.originIndex] = {\n            id: item.id,\n            index: item.originIndex,\n            type: item.type,\n            removed: false\n          };\n        }\n      });\n      boosterCounts.return -= 1;\n      lastMove = null;\n      renderBoard();\n      renderTray();\n      scheduleResolveMatches();\n    }\n\n    function useHint() {\n      if (locked || boosterCounts.hint \u003c= 0) return;\n      boosterCounts.hint -= 1;\n      showHint();\n      renderTray();\n    }\n\n    function addTime() {\n      if (locked || boosterCounts.time \u003c= 0) return;\n      timeLeft += ADD_TIME_SECONDS;\n      boosterCounts.time -= 1;\n      updateTimer();\n      renderTray();\n    }\n\n    function updateTimer() {\n      const el = document.getElementById('goalTimer');\n      if (el) el.textContent = `${Math.max(0, timeLeft)}S`;\n    }\n\n    function startTimer() {\n      stopTimer();\n      if (GUIDE_MODE) { updateTimer(); return; }\n      timerId = window.setInterval(() => {\n        if (locked) return;\n        timeLeft -= 1;\n        updateTimer();\n        if (timeLeft \u003c= 0) {\n          timeLeft = 0;\n          updateTimer();\n          showResult(false);\n        }\n      }, 1000);\n    }\n\n    function stopTimer() {\n      if (timerId) {\n        window.clearInterval(timerId);\n        timerId = null;\n      }\n    }\n\n    function bindPress(element, handler) {\n      let lastPressTime = 0;\n      element.addEventListener('pointerdown', (event) => {\n        event.preventDefault();\n        unlockAudio();\n        const now = performance.now();\n        if (now - lastPressTime \u003c 45) return;\n        lastPressTime = now;\n        handler(event);\n      }, { passive: false });\n      element.addEventListener('click', (event) => {\n        event.preventDefault();\n      });\n    }\n\n    function fitPhoneToViewport() {\n      const scale = Math.min(window.innerWidth / 390, window.innerHeight / 844, 1);\n      document.documentElement.style.setProperty('--app-scale', String(scale));\n    }\n\n    window.addEventListener('resize', fitPhoneToViewport);\n    window.addEventListener('orientationchange', () => window.setTimeout(fitPhoneToViewport, 120));\n    window.addEventListener('pageshow', requestMusicStart);\n    document.addEventListener('pointerdown', () => {\n      unlockAudio();\n      const needsMusicStart = !bgmAudio || (bgmAudio.paused && !bgmPlayRequested);\n      if (needsMusicStart && !homeScreen.classList.contains('is-open')) {\n        requestMusicStart();\n      }\n    }, { capture: true });\n    document.addEventListener('visibilitychange', () => {\n      if (document.visibilityState === 'visible' && !homeScreen.classList.contains('is-open')) {\n        requestMusicStart();\n      }\n    });\n    fitPhoneToViewport();\n\n    bindPress(document.getElementById('undoBtn'), returnLastThree);\n    bindPress(document.getElementById('hintBtn'), useHint);\n    bindPress(document.getElementById('timeBtn'), addTime);\n    bindPress(restartBtn, resetGame);\n    bindPress(resultCloseBtn, returnToHome);\n    bindPress(homeStartBtn, resetGame);\n\n    const pauseBtn = document.getElementById('pauseBtn');\n    const pauseIcon = document.getElementById('pauseIcon');\n    const pauseModal = document.getElementById('pauseModal');\n    const resumeBtn = document.getElementById('resumeBtn');\n    const abandonBtn = document.getElementById('abandonBtn');\n    const sfxSwitch = document.getElementById('sfxSwitch');\n    const musicSwitch = document.getElementById('musicSwitch');\n    const vibrationSwitch = document.getElementById('vibrationSwitch');\n\n    bindPress(pauseBtn, () => {\n      if (resultModal.classList.contains('is-open') || homeScreen.classList.contains('is-open')) return;\n      locked = true;\n      document.getElementById('pauseBtn').classList.add('is-playing');\n      pauseModal.classList.add('is-open');\n      stopTimer();\n    });\n\n    bindPress(resumeBtn, () => {\n      locked = false;\n      document.getElementById('pauseBtn').classList.remove('is-playing');\n      pauseModal.classList.remove('is-open');\n      startTimer();\n    });\n\n    bindPress(abandonBtn, () => {\n      returnToHome();\n    });\n\n    [\n      [sfxSwitch, 'sfx'],\n      [musicSwitch, 'music'],\n      [vibrationSwitch, 'vibration']\n    ].forEach(([switchEl, key]) => {\n      bindPress(switchEl, () => {\n        mediaState[key] = !mediaState[key];\n        switchEl.classList.toggle('is-off', !mediaState[key]);\n        if (key === 'music') {\n          if (mediaState.music) startMusic();\n          else stopMusic();\n        }\n      });\n    });\n\n    resetGame();\n    requestMusicStart();\n\n    const previewModal = new URLSearchParams(window.location.search).get('modal');\n    if (previewModal === 'pause') {\n      locked = true;\n      document.getElementById('pauseBtn').classList.add('is-playing');\n      pauseModal.classList.add('is-open');\n      stopTimer();\n    } else if (previewModal === 'success') {\n      earnedPoints = TARGET_GROUPS * POINTS_PER_GROUP;\n      updatePoints();\n      showResult(true);\n    } else if (previewModal === 'failure') {\n      showResult(false);\n    }\n  \u003c/script>\n\u003cscript>window.parent.postMessage({type:\"match3-ready\"}, \"*\");\u003c/script>\u003c/body>\n\u003c/html>\n";
    const stage = document.getElementById('stage');
    const phone = document.getElementById('phone');
    const game = document.getElementById('game');
    const notice = document.getElementById('notice');
    let loadingTimer;
    function fitPhone() {
      const scale = Math.max(.1, Math.min(1, (stage.clientWidth - 28) / 410, (stage.clientHeight - 24) / 864));
      phone.style.setProperty('--phone-scale', String(scale));
    }
    function startGame() {
      clearTimeout(loadingTimer);
      notice.style.display = 'none';
      loadingTimer = setTimeout(() => { notice.style.display = 'block'; }, 20000);
      // The game document is bundled here; no remote iframe navigation is needed.
      game.srcdoc = embeddedGame;
    }
    window.addEventListener('message', (event) => {
      if (event.source === game.contentWindow && event.data?.type === 'match3-ready') {
        clearTimeout(loadingTimer); notice.style.display = 'none';
      }
    });
    document.getElementById('restart').addEventListener('click', startGame);
    document.getElementById('dismiss').addEventListener('click', () => { notice.style.display = 'none'; });
    new ResizeObserver(fitPhone).observe(stage);
    window.addEventListener('resize', fitPhone);
    fitPhone();
    startGame();
  </script>
